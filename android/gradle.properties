# gradle.properties — the one thing prose cannot pin.
#
# History
#   2026-08-09  A. Sigdel  Created, for R8.
#
# settings.gradle.kts says the toolchain here is pinned by prose rather than by
# a properties file, and it still is: every version lives there, with the reason
# it is that version beside it. This file is not a second place for versions.
#
# It exists because R8 will not run in Gradle's default 512 MiB. The failure is
# not an out-of-memory error but a daemon that dies mid-task — "the JVM garbage
# collector is thrashing" — which reads like a broken machine rather than a
# setting, and which appears only on a release build, so it waits until the
# first person tries to ship something.
#
# The debug build escapes it, which is why nothing needed this until now.

org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
