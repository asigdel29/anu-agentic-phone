[package]
name = "wattrouter"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Routes OpenAI-compatible requests to the cheapest upstream model that can serve them."
license = "MIT"

[lib]
name = "wattrouter"
path = "src/lib.rs"

[[bin]]
name = "wattrouter"
path = "src/main.rs"

[features]
# On by default so CI exercises it and the board gets the better embedding.
# Disable to drop ONNX Runtime entirely: `--no-default-features` yields a router
# that only ever hashes, which is the right build for a memory-tight board.
default = ["onnx"]
onnx = ["dep:fastembed"]

[dependencies]
# rustls throughout, and default features off. The defaults are
# hf-hub-native-tls and ort-download-binaries-native-tls, both of which drag in
# openssl-sys and fail the aarch64 cross-build outright.
fastembed = { version = "5.17.4", optional = true, default-features = false, features = [
    "hf-hub",
    "hf-hub-rustls-tls",
    "ort-download-binaries-rustls-tls",
] }
# axum over a hand-rolled hyper service: the streaming passthrough added later
# needs body streaming both ways, and axum's Body is hyper's, so the routing
# convenience costs nothing.
axum = "0.8"
futures-util = { version = "0.3", default-features = false }
# rustls rather than the system OpenSSL: the router cross-compiles to aarch64,
# and vendoring the TLS stack keeps that a pure Rust build.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
    "http2",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# Drives the router directly, so endpoint tests neither bind a port nor race for
# one in CI.
tower = { version = "0.5", features = ["util"] }
async-stream = "0.3"
http-body-util = "0.1"

[profile.release]
# The target board is small and the binary is long-lived, so favour resident size
# and the optimiser over build time. lto with a single codegen unit cuts both the
# binary and the steady-state footprint measurably.
lto = true
codegen-units = 1
strip = true
