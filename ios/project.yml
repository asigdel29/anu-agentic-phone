# project.yml — the Xcode project, as a file a person can read.
#
# History
#   2026-08-07  A. Sigdel  Created.
#
# Generated into WattRouter.xcodeproj by `just ios-project`, which is why that
# directory is gitignored. A checked-in project.pbxproj is unreviewable under this
# repository's size limit: it is generated, it reorders itself between Xcode
# versions, and it conflicts on every parallel change. This says the same thing in
# forty lines that can be diffed.
#
# The library target stays in Package.swift. Only the app is described here, and
# it depends on the package next to it, so `swift build` and `scripts/test-ios.sh`
# keep working untouched.

name: WattRouter

options:
  bundleIdPrefix: com.getlora
  # Matches the floor in Package.swift. Two floors that can disagree is a link
  # error naming neither, so this is the one place either is written.
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  # The package in this directory, by path rather than by URL: it is the same
  # working copy, so a change to the library is in the app on the next build
  # without a version to bump.
  WattRouter:
    path: .

targets:
  WattRouterApp:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: WattRouter
        product: WattRouter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.getlora.wattrouter
        # No asset catalogue yet, so nothing here names an icon. Xcode warns
        # about that and the warning is correct; an empty appiconset carrying no
        # image would silence it while changing nothing.
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1.0"
        SWIFT_VERSION: "6.0"
        # The library is built with strict concurrency and the app has to be too,
        # or an actor mistake surfaces only after the app target is the one
        # holding state.
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_USER_SCRIPT_SANDBOXING: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: WattRouter
        # Portrait only for now. A landscape layout is a design decision nobody
        # has made, and shipping one that was never looked at is worse than not
        # offering it.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UILaunchScreen: {}
        # Shown inside the system's prompt, which is the only place a person
        # reads them. Both are here rather than only the calendar one because
        # EventKitAuthorizer can request either entity, and requesting one whose
        # string is absent terminates the app rather than refusing.
        #
        # Written as what the agent does with it, not as what the app would like.
        # "To provide a better experience" is the register that trains people to
        # refuse, which #137 is explicitly trying not to do.
        NSCalendarsFullAccessUsageDescription: >-
          So the agent can tell you what is on your calendar, and work around it.
          Full access rather than add-only: reading is the whole point, and
          add-only access reads an empty calendar rather than refusing.
        NSRemindersFullAccessUsageDescription: >-
          So the agent can read your reminders and add to them when you ask.
        # Read only. Nothing in this app writes to the address book, and the
        # sentence says so rather than reserving room for something that might.
        NSContactsUsageDescription: >-
          So the agent can look somebody up when you name them. It searches by
          name and reads their numbers and email addresses; it never changes
          anything in your contacts.
        # When in use only. `always` is a different prompt meaning a different
        # thing, and nothing here runs in the background or tracks anybody.
        NSLocationWhenInUseUsageDescription: >-
          So the agent can answer questions that depend on where you are. It
          takes one location when a turn asks for one, and never in the
          background.
        # Nothing here talks to anything but the provider, over HTTPS. The
        # default already forbids cleartext; this states it so that relaxing it
        # later has to be a deliberate edit.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false

  # The package's own tests, so they can run on a simulator. Package.swift declares
  # the same sources as a testTarget, which is what `swift build` uses; this is the
  # second way in, and it exists because a package test target is not reachable
  # through the app's scheme, so `xcodebuild test` had nothing to run.
  #
  # Hosted in the application, which is not a formality. Most of these exercise the
  # library and would run anywhere, but the Keychain ones need a keychain, and an
  # unhosted bundle has no application identifier to own an item — every write
  # returns false and every read nil, which reads as a broken Keychain wrapper
  # rather than a missing host. Measured: nine failures without a host, none with.
  WattRouterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/WattRouterTests
    dependencies:
      - target: WattRouterApp
      - package: WattRouter
        product: WattRouter
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: true

# An explicit scheme, because the one Xcode invents for a test target does not
# build the application the target is hosted in. TEST_HOST then names an app that
# was never built, the bundle runs on its own as com.apple.dt.xctest.tool, and
# every Keychain call answers -34018: a required entitlement isn't present. The
# suite reads as nine broken assertions about the Keychain, and the cause is a
# scheme that did not build one target.
schemes:
  # Naming any scheme here stops XcodeGen inventing the rest, so the application
  # needs one too — it had one by default until this block existed, and lost it
  # silently because nothing built it by name until the app grew a second screen.
  WattRouterApp:
    build:
      targets:
        WattRouterApp: all
    run:
      config: Debug

  WattRouterTests:
    build:
      targets:
        WattRouterApp: [test]
        WattRouterTests: [test]
    test:
      targets:
        - WattRouterTests
