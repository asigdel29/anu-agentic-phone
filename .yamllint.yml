# yamllint configuration.
#
# History
#   2026-08-05  A. Sigdel  Created.
#
# Workflow YAML is wide by nature, since expression syntax does not wrap, so the line
# limit is relaxed rather than fought. Everything else is left strict.

extends: default

rules:
  line-length:
    max: 140
    level: error
  # `on:` in a workflow is the trigger block, not the boolean true. Without this,
  # every workflow in the repository is a warning.
  truthy:
    allowed-values: ["true", "false"]
    check-keys: false
  comments:
    min-spaces-from-content: 1
  document-start: disable

# Build output, not sources. Gradle writes YAML nothing here wrote and nothing
# here can fix, and a local run
# that drowns in it is a run people stop doing. CI never sees these, since it
# builds from a fresh checkout, so this only makes the local gate match CI.
ignore: |
  .venv/
  router/target/
  android/**/build/
