# Hermes configuration for this stack.
#
# History
#   2026-08-05  A. Sigdel  Created.
#
# Copy to ~/.hermes/config.yaml, or merge these keys into an existing one.
# Everything here is deliberate; docs/decisions/INDEX.md routes to the reasoning.

model:
  # The router decides. Pin a tier by name (heavy, code, long, mid, cheap,
  # aux) only to override a decision that came out wrong.
  default: "auto"
  provider: "neuralwatt"
  base_url: "http://127.0.0.1:8080/v1"

  # Left unset on purpose. Hermes auto-detects the window from the provider, and
  # the router advertises whichever tier serves a request; a fixed value here
  # would be wrong for five tiers out of six.
  # context_length:

providers:
  neuralwatt:
    # A heavy-tier answer legitimately takes minutes, and the router may spend a
    # round trip on a failed model before falling back. Below the router's own
    # 30-minute ceiling so the router is what gives up first, with a reason.
    request_timeout_seconds: 1500
    # The router is on loopback and never idles mid-request; the stale detector
    # would only produce false positives.
    stale_timeout_seconds: 0

memory:
  memory_enabled: true
  # Retrieval and indexing make no LLM calls, so remembering costs no tokens.
  # Swap this line for a bundled provider if zeromem misbehaves, and nothing else
  # in the stack depends on it.
  provider: zeromem
  write_approval: false

# User plugins are opt-in, and the allow-list is a flat list of names under
# `enabled`. It was written here as `plugins.<name>.enabled: true`, which
# `_get_enabled_plugins` does not read: it looks for the `enabled` key, finds a
# mapping where it wants a list, and returns "nothing enabled". Under that shape
# neither plugin below would ever have loaded, and nothing would have said so.
plugins:
  enabled:
    # Adds x-session-id to routed requests, so the router can keep a
    # conversation on the tier it was raised to instead of re-scoring each turn.
    - session_routing
    # Memory. Installed separately by deploy/install-zeromem.sh; naming it here
    # before it is installed is harmless, since discovery is what gates loading.
    - zeromem

# Hermes does the coding itself; see docs/decisions/retiring-the-second-harness.md. The bundled skill
# that delegates it to a second harness is turned off rather than left advertised,
# so the model is not offered a tool whose whole job is to start a process this
# stack no longer runs.
skills:
  disabled:
    - opencode
