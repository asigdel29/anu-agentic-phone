# ci.yml: formatting, lints and tests for every pull request.
#
# History
#   2026-08-05  A. Sigdel  Created with the static checks: formatting and lints.
#                          Tests and the cross-build follow immediately; the
#                          documentation and complexity gates follow later, as
#                          they depend on lint scripts that do not exist yet.
#   2026-08-08  A. Sigdel  The Android JVM suite, after six pull requests of
#                          Kotlin merged with nothing here compiling any of it.
#   2026-08-10  A. Sigdel  The cross-build and the header check go with #564.
#                          The board one targeted and the header the other
#                          compiled were both removed, and a job with nothing
#                          left to prove still fails for unrelated reasons.
#
# Runs on merge_group as well as pull_request: the merge queue builds each
# candidate on its own ref and waits for these checks, so a change is re-validated
# against the latest main before it lands rather than against whatever main was
# when the branch opened.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

# github.ref is the pull request ref on pull_request and a unique per-candidate
# ref on merge_group, so queued candidates never cancel one another.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Which languages are actually present. The router and training code arrive in
  # later changes, and a gate that fails because a directory does not exist yet
  # teaches people to ignore it. Each job below guards on these outputs, so every
  # gate goes live on its own the moment its first file lands.
  detect:
    name: Detect languages
    if: ${{ github.event_name == 'merge_group' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.probe.outputs.rust }}
      python: ${{ steps.probe.outputs.python }}
      kotlin: ${{ steps.probe.outputs.kotlin }}
    steps:
      - uses: actions/checkout@v7
      - id: probe
        run: |
          set -euo pipefail
          test -f router/Cargo.toml && echo "rust=true" >> "$GITHUB_OUTPUT" || echo "rust=false" >> "$GITHUB_OUTPUT"
          test -f train/pyproject.toml && echo "python=true" >> "$GITHUB_OUTPUT" || echo "python=false" >> "$GITHUB_OUTPUT"
          test -f android/settings.gradle.kts && echo "kotlin=true" >> "$GITHUB_OUTPUT" || echo "kotlin=false" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  format:
    name: Format
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Shell and YAML exist from the first commit, so these two always run.
      - name: shfmt
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/shfmt https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64
          chmod +x /tmp/shfmt
          # -z and -0 so a filename containing whitespace cannot split into two
          # arguments; -r so an empty file list is not an invocation with none.
          git ls-files -z '*.sh' | xargs -0 -r /tmp/shfmt -d -i 4 -ci

      - name: yamllint
        run: |
          set -euo pipefail
          pipx install yamllint==1.35.1
          yamllint -c .yamllint.yml .

      - uses: ./.github/actions/rust-setup
        if: needs.detect.outputs.rust == 'true'
        with:
          components: rustfmt
          cache-key: format
      - name: cargo fmt
        if: needs.detect.outputs.rust == 'true'
        run: cargo fmt --manifest-path router/Cargo.toml --check

      - uses: ./.github/actions/python-setup
        if: needs.detect.outputs.python == 'true'
        with:
          cache-key: format
      - name: ruff format
        if: needs.detect.outputs.python == 'true'
        run: uvx ruff format --check train/

  lint:
    name: Lint
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: shellcheck
        run: |
          set -euo pipefail
          # -r so an empty file list is a no-op rather than a bare invocation:
          # shell scripts arrive in later changes.
          #
          # -x follows a sourced file, which a guard now has. Without it the
          # source is reported unresolved and every variable the sourced file
          # defines reads as undefined, which is noise that would push somebody towards
          # suppressing the check rather than fixing it.
          git ls-files -z '*.sh' | xargs -0 -r shellcheck -x --severity=style

      # Both read every tracked file rather than the diff: a header or a tag can
      # go missing by deleting a line, and a check that only reads what a change
      # touched never sees that.
      - name: file headers
        run: bash scripts/lint/file-headers.sh

      - name: doc tags
        run: bash scripts/lint/doc-tags.sh

      # The two above, and the guard runner, checked for the failure they
      # cannot report on themselves: a gate that exits zero because it did not
      # run. #478 has the four places that did it.
      - name: gates fail closed
        run: bash scripts/lint/test-gates.sh

      # The notices are generated, so the way they go wrong is by nobody
      # regenerating them. This is the check rather than the habit.
      - name: third-party notices are current
        run: bash scripts/notices.sh --check

      # Workflows are the one kind of source here that cannot be exercised
      # locally, so they get a linter of their own. actionlint also runs
      # shellcheck over every `run:` block, which is how the two quoting bugs in
      # this file's first draft were caught.
      - name: actionlint
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            | tar xz -C /tmp actionlint
          /tmp/actionlint

      - uses: ./.github/actions/rust-setup
        if: needs.detect.outputs.rust == 'true'
        with:
          components: clippy
          cache-key: lint
      # -D warnings makes every lint fatal. The pedantic set is opted into
      # per-crate in router/src/main.rs rather than here, so a developer running
      # clippy locally sees exactly what CI sees.
      - name: clippy
        if: needs.detect.outputs.rust == 'true'
        run: cargo clippy --manifest-path router/Cargo.toml --all-targets --all-features -- -D warnings

      - uses: ./.github/actions/python-setup
        if: needs.detect.outputs.python == 'true'
        with:
          cache-key: lint
      - name: ruff
        if: needs.detect.outputs.python == 'true'
        run: uvx ruff check train/
      - name: mypy
        if: needs.detect.outputs.python == 'true'
        run: uv run --project train mypy --strict train/

  test:
    name: Test
    needs: detect
    if: ${{ needs.detect.outputs.rust == 'true' || needs.detect.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/rust-setup
        if: needs.detect.outputs.rust == 'true'
        with:
          cache-key: test
      # --all-targets so the test build covers benches and examples too; a bench
      # that stops compiling is a break, and finding it at release time is worse.
      - name: cargo test
        if: needs.detect.outputs.rust == 'true'
        run: cargo test --manifest-path router/Cargo.toml --all-targets --all-features

      - uses: ./.github/actions/python-setup
        if: needs.detect.outputs.python == 'true'
        with:
          cache-key: test
      - name: pytest
        if: needs.detect.outputs.python == 'true'
        run: uv run --project train pytest train/ -q

  # The benches carry gates, and a gate nothing runs is a comment. These are
  # ratios between stages timed in the same run, never absolute figures: a shared
  # runner is slower and noisier than any developer machine, so a threshold in
  # nanoseconds would either be loose enough to miss real regressions or tight
  # enough to fail at random. A ratio scales with the runner and stays put.
  #
  # --no-default-features because neither bench touches the ONNX embedder, and it
  # is the difference between a 1m25s build and a 15m one.
  #
  # WATTROUTER_BENCH_QUICK trims the sweeps to what the gates need. It reduces
  # levels and waiting, never the samples within a level; the benches document
  # why, having once reported connection warmup as a throughput collapse.
  perf:
    name: Performance gates
    needs: detect
    if: ${{ needs.detect.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: perf
      - name: Gate the serve path
        env:
          WATTROUTER_BENCH_QUICK: "1"
        run: cargo bench --manifest-path router/Cargo.toml --bench serve --no-default-features
      # Spawns the router and drives it over loopback, so it needs the binary
      # built by the same invocation rather than a copy of the handler.
      - name: Gate the router under load
        env:
          WATTROUTER_BENCH_QUICK: "1"
        run: cargo bench --manifest-path router/Cargo.toml --bench load --no-default-features

  # The JVM half of the Android suite. It needs no emulator, no NDK and no Rust
  # build: what it covers is the request a turn becomes, which touches nothing
  # Android and so runs anywhere.
  #
  # The instrumented half is deliberately absent and cannot be added here. The
  # system image is arm64-v8a and this runner is x86_64 with no KVM for it, so
  # the emulator would run under full QEMU and never meet the 300s boot limit
  # scripts/test-android.sh allows. macos-latest is Apple silicon and could, at
  # several minutes a run. Until that trade is worth making, the only suite that
  # can load the library stays a local gate. android/AGENTS.md says so, and it
  # is why a pull request there has to name which of the two it ran.
  android:
    name: Android
    needs: detect
    if: ${{ needs.detect.outputs.kotlin == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # There is no wrapper here (a wrapper is a jar, and this repository does
      # not track binaries it cannot review) so the version is named rather
      # than read out of a properties file, and it is the full release name:
      # `9.7` is not a version this resolves, `9.7.0` is.
      #
      # The action's wrapper validation stays on and passes over nothing, which
      # is the right way round. Turning it off would mean a wrapper jar arriving
      # later goes unchecked as well as unwanted.
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.0'

      # --rerun-tasks is not optional. Gradle reports a cached test task as
      # UP-TO-DATE and exits zero having run nothing, which here would be a
      # permanently green check over an empty run.
      - name: gradle test
        working-directory: android
        run: gradle test --rerun-tasks --console=plain

  # One check for branch protection to require, so adding a job does not mean
  # editing the ruleset. Skipped is a pass: a job guarded off by `detect` has
  # nothing to say.
  #
  # A job belongs in both `needs` and `RESULTS`. In `needs` alone it is waited
  # for and its result ignored, which is worse than not gating it at all: the
  # aggregator reports green over a red job. Adding one without proving it can
  # turn this check red is trusting the YAML.
  # The Dockerfile is how the router reaches a platform, and nothing else in this
  # workflow compiles it. A break specific to the image -- a missing system
  # library, a stale base tag, a layer order that stops caching -- would
  # otherwise surface during a deployment, which is the worst place to find it.
  #
  # It also makes a claim nobody could make locally: #537 was written on a
  # machine whose Docker had a corrupt content store and 3.5GB of disk, so the
  # image had never been built anywhere when the Dockerfile was merged. This job
  # is what changed that.
  #
  # Built and not pushed. A registry is a credential and a decision about where
  # images live, and neither belongs in a check that only has to answer whether
  # the thing compiles.
  image:
    name: Image
    needs: detect
    if: ${{ needs.detect.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build --tag wattrouter:ci .
      - name: It starts and answers liveness
        run: |
          set -euo pipefail
          # A build that produces an image which cannot start is a build that
          # passed for no reason. PORT rather than an address, because that is
          # what a platform sets and the path #537 added.
          docker run --rm --detach --name probe \
            --env PORT=8080 \
            --env NEURALWATT_API_KEY=not-a-real-key \
            --publish 8080:8080 wattrouter:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
              printf 'the image starts and answers /healthz\n'
              docker rm --force probe >/dev/null
              exit 0
            fi
            sleep 1
          done
          printf 'the image never answered /healthz\n' >&2
          docker logs probe >&2 || true
          docker rm --force probe >/dev/null 2>&1 || true
          exit 1

  required:
    name: Required
    needs: [detect, format, lint, test, perf, android, image]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify every job succeeded or was skipped
        env:
          RESULTS: >-
            detect:${{ needs.detect.result }}
            format:${{ needs.format.result }}
            lint:${{ needs.lint.result }}
            test:${{ needs.test.result }}
            perf:${{ needs.perf.result }}
            android:${{ needs.android.result }}
            image:${{ needs.image.result }}
        run: |
          set -euo pipefail
          fail=0
          for entry in $RESULTS; do
            name="${entry%%:*}"
            result="${entry##*:}"
            case "$result" in
              success | skipped) printf '  %-12s %s\n' "$name" "$result" ;;
              *) printf '  %-12s %s  FAIL\n' "$name" "$result"; fail=1 ;;
            esac
          done
          exit "$fail"
